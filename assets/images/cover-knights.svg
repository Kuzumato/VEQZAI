<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="ksky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="50%" stop-color="#0a1a28"/>
      <stop offset="100%" stop-color="#061830"/>
    </linearGradient>
    <radialGradient id="kglow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#40a0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#40a0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="kf"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="kf2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="400" height="220" fill="url(#ksky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="20" cy="15" r="1"/><circle cx="60" cy="8" r="1.5"/><circle cx="100" cy="22" r="1"/>
    <circle cx="150" cy="10" r="1"/><circle cx="200" cy="18" r="1.5"/><circle cx="260" cy="6" r="1"/>
    <circle cx="320" cy="20" r="1"/><circle cx="370" cy="12" r="1.5"/><circle cx="40" cy="40" r="1"/>
    <circle cx="330" cy="40" r="1"/><circle cx="180" cy="35" r="1"/>
  </g>

  <!-- Full moon -->
  <circle cx="320" cy="45" r="30" fill="#c8e0ff" opacity="0.9"/>
  <circle cx="320" cy="45" r="34" fill="#a0c8ff" opacity="0.15" filter="url(#kf2)"/>

  <!-- Distant fortress on hill -->
  <path d="M120 140 Q160 100 200 95 Q240 100 280 140Z" fill="#081420"/>
  <g fill="#061018">
    <!-- Main tower -->
    <rect x="183" y="70" width="34" height="75"/>
    <rect x="178" y="62" width="8" height="12"/>
    <rect x="190" y="58" width="8" height="16"/>
    <rect x="202" y="62" width="8" height="12"/>
    <rect x="214" y="58" width="8" height="16"/>
    <!-- Battlements -->
    <rect x="178" y="56" width="6" height="8"/>
    <rect x="188" y="52" width="6" height="8"/>
    <rect x="198" y="52" width="6" height="8"/>
    <rect x="208" y="52" width="6" height="8"/>
    <rect x="218" y="56" width="6" height="8"/>
    <!-- Side walls -->
    <rect x="140" y="100" width="45" height="45"/>
    <rect x="215" y="100" width="45" height="45"/>
    <!-- Gate arch -->
    <rect x="192" y="112" width="16" height="33" rx="3"/>
  </g>
  <!-- Castle window lights -->
  <rect x="192" y="80" width="6" height="8" rx="1" fill="#60a0ff" opacity="0.6"/>
  <rect x="202" y="78" width="6" height="8" rx="1" fill="#4080cc" opacity="0.4"/>
  <rect x="148" y="108" width="6" height="6" rx="1" fill="#60a0ff" opacity="0.5"/>
  <rect x="225" y="108" width="6" height="6" rx="1" fill="#60a0ff" opacity="0.5"/>

  <!-- Torch glow on castle -->
  <circle cx="183" cy="102" r="6" fill="#ffa040" opacity="0.4" filter="url(#kf2)"/>
  <circle cx="217" cy="102" r="6" fill="#ffa040" opacity="0.4" filter="url(#kf2)"/>
  <circle cx="183" cy="102" r="2" fill="#ffcc80" opacity="0.9"/>
  <circle cx="217" cy="102" r="2" fill="#ffcc80" opacity="0.9"/>

  <!-- Road path -->
  <path d="M160 220 Q200 190 200 145" fill="none" stroke="#0a1828" stroke-width="8"/>
  <path d="M160 220 Q200 190 200 145" fill="none" stroke="#0d2035" stroke-width="4"/>

  <!-- Foreground knight figure -->
  <g transform="translate(200,210)">
    <!-- Legs -->
    <rect x="-10" y="-45" width="9" height="45" rx="3" fill="#0c1828"/>
    <rect x="1" y="-45" width="9" height="45" rx="3" fill="#0a1420"/>
    <!-- Tabard/surcoat -->
    <path d="M-14 -83 L14 -83 L16 -45 L-16 -45Z" fill="#0a1428"/>
    <!-- Cross on tabard -->
    <rect x="-2" y="-78" width="4" height="20" rx="1" fill="#c0d8ff" opacity="0.5"/>
    <rect x="-8" y="-71" width="16" height="4" rx="1" fill="#c0d8ff" opacity="0.5"/>
    <!-- Chainmail arms -->
    <line x1="-14" y1="-72" x2="-26" y2="-60" stroke="#0c1828" stroke-width="9" stroke-linecap="round"/>
    <line x1="14" y1="-72" x2="30" y2="-62" stroke="#0c1828" stroke-width="9" stroke-linecap="round"/>
    <!-- Shield (left) -->
    <path d="M-26 -65 L-40 -58 L-40 -38 L-26 -32 L-26 -65Z" fill="#0a1428" stroke="#3060a0" stroke-width="1.5"/>
    <rect x="-38" y="-60" width="4" height="20" rx="1" fill="#4080c0" opacity="0.3"/>
    <rect x="-38" y="-52" width="12" height="4" rx="1" fill="#4080c0" opacity="0.3"/>
    <!-- Sword (right raised) -->
    <line x1="30" y1="-62" x2="34" y2="-110" stroke="#8ab8e8" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="-88" x2="40" y2="-83" stroke="#5080a8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sword glow -->
    <line x1="32" y1="-65" x2="34" y2="-108" stroke="#c0e0ff" stroke-width="1" opacity="0.5" filter="url(#kf2)"/>
    <!-- Helmet -->
    <ellipse cx="0" cy="-92" rx="12" ry="13" fill="#0c1828"/>
    <!-- Visor slits -->
    <rect x="-8" y="-91" width="6" height="2" rx="1" fill="#3060a0" opacity="0.6"/>
    <rect x="2" y="-91" width="6" height="2" rx="1" fill="#3060a0" opacity="0.6"/>
    <!-- Plume -->
    <path d="M0 -105 Q-8 -115 -4 -120 Q0 -118 4 -120 Q8 -115 0 -105" fill="#c03020" opacity="0.8"/>
  </g>

  <!-- Ground glow -->
  <ellipse cx="200" cy="215" rx="60" ry="12" fill="#2060a0" opacity="0.1" filter="url(#kf)"/>

  <!-- Mist -->
  <rect x="0" y="195" width="400" height="25" fill="#061018" opacity="0.6"/>
  <ellipse cx="100" cy="205" rx="120" ry="15" fill="#0a2040" opacity="0.3" filter="url(#kf)"/>
  <ellipse cx="320" cy="208" rx="100" ry="12" fill="#0a2040" opacity="0.3" filter="url(#kf)"/>

  <!-- Title -->
  <rect x="0" y="0" width="400" height="35" fill="#060e18" opacity="0.7"/>
  <text x="200" y="23" text-anchor="middle" fill="#80b8e8" font-size="14" font-family="Georgia, serif" font-weight="bold" letter-spacing="4">KNIGHT'S RESCUE</text>
  <line x1="70" y1="30" x2="330" y2="30" stroke="#2a5080" stroke-width="0.5" opacity="0.5"/>
</svg>
