<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a1f"/>
      <stop offset="100%" stop-color="#06091a"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b5fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4fc8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b5fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7b5fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#a78bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="400" fill="url(#bg)"/>

  <!-- Spotlight glow on floor -->
  <ellipse cx="160" cy="380" rx="140" ry="40" fill="#7b5fff" opacity="0.18" filter="url(#blur8)"/>

  <!-- Arena floor grid lines -->
  <g opacity="0.25" stroke="#6b4ff7" stroke-width="0.5">
    <!-- Horizontal perspective lines -->
    <line x1="0" y1="380" x2="320" y2="380"/>
    <line x1="20" y1="360" x2="300" y2="360"/>
    <line x1="50" y1="340" x2="270" y2="340"/>
    <line x1="80" y1="320" x2="240" y2="320"/>
    <!-- Vertical perspective lines -->
    <line x1="160" y1="250" x2="0" y2="400"/>
    <line x1="160" y1="250" x2="40" y2="400"/>
    <line x1="160" y1="250" x2="80" y2="400"/>
    <line x1="160" y1="250" x2="120" y2="400"/>
    <line x1="160" y1="250" x2="160" y2="400"/>
    <line x1="160" y1="250" x2="200" y2="400"/>
    <line x1="160" y1="250" x2="240" y2="400"/>
    <line x1="160" y1="250" x2="280" y2="400"/>
    <line x1="160" y1="250" x2="320" y2="400"/>
  </g>

  <!-- Back screens / stage -->
  <rect x="30" y="80" width="260" height="140" rx="4" fill="#0a0820" stroke="#4a2fff" stroke-width="1" opacity="0.9"/>
  <!-- Screen glow -->
  <rect x="30" y="80" width="260" height="140" rx="4" fill="#3a1aff" opacity="0.07" filter="url(#blur4)"/>

  <!-- Screen content — abstract tournament bracket lines -->
  <g opacity="0.5" stroke="#8b7fff" stroke-width="1" fill="none">
    <rect x="55" y="95" width="30" height="14" rx="2"/>
    <rect x="235" y="95" width="30" height="14" rx="2"/>
    <rect x="55" y="150" width="30" height="14" rx="2"/>
    <rect x="235" y="150" width="30" height="14" rx="2"/>
    <rect x="135" y="122" width="50" height="14" rx="2"/>
    <!-- connector lines -->
    <line x1="85" y1="102" x2="135" y2="129"/>
    <line x1="235" y1="102" x2="185" y2="129"/>
    <line x1="85" y1="157" x2="135" y2="136"/>
    <line x1="235" y1="157" x2="185" y2="136"/>
  </g>
  <!-- Screen label -->
  <text x="160" y="208" text-anchor="middle" fill="#c4aaff" font-size="9" font-family="monospace" opacity="0.7">TOURNAMENT BRACKET</text>

  <!-- Left monitor stand -->
  <rect x="10" y="140" width="18" height="100" rx="2" fill="#150e30" stroke="#3a2aaa" stroke-width="0.5"/>
  <rect x="10" y="140" width="18" height="80" rx="2" fill="#1e1455" opacity="0.6"/>
  <rect x="4" y="135" width="30" height="50" rx="2" fill="#0d0a2a" stroke="#4a35cc" stroke-width="0.5"/>

  <!-- Right monitor stand -->
  <rect x="292" y="140" width="18" height="100" rx="2" fill="#150e30" stroke="#3a2aaa" stroke-width="0.5"/>
  <rect x="292" y="140" width="18" height="80" rx="2" fill="#1e1455" opacity="0.6"/>
  <rect x="286" y="135" width="30" height="50" rx="2" fill="#0d0a2a" stroke="#4a35cc" stroke-width="0.5"/>

  <!-- Stage platform -->
  <rect x="60" y="255" width="200" height="12" rx="3" fill="#1a1240" stroke="#5a3fff" stroke-width="1"/>
  <rect x="60" y="255" width="200" height="12" rx="3" fill="url(#floor)" opacity="0.4"/>

  <!-- Center hero silhouette -->
  <!-- Body -->
  <ellipse cx="160" cy="225" rx="22" ry="28" fill="#0f0c24"/>
  <!-- Cape/cloak -->
  <path d="M138 215 Q155 260 145 285 L160 275 L175 285 Q165 260 182 215 Z" fill="#1a0f3a" opacity="0.9"/>
  <!-- Armor highlight -->
  <path d="M148 210 Q160 200 172 210 L175 230 Q160 225 145 230 Z" fill="#2a1a5a" opacity="0.8"/>
  <!-- Head -->
  <ellipse cx="160" cy="200" rx="13" ry="15" fill="#12102a"/>
  <!-- Helmet visor glow -->
  <ellipse cx="160" cy="200" rx="8" ry="5" fill="#7b5fff" opacity="0.6" filter="url(#blur2)"/>
  <ellipse cx="160" cy="200" rx="5" ry="3" fill="#b89fff" opacity="0.8"/>
  <!-- Sword right -->
  <line x1="175" y1="215" x2="205" y2="260" stroke="#c0a8ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="171" y1="220" x2="183" y2="218" stroke="#8870cc" stroke-width="2" stroke-linecap="round"/>
  <!-- Shield left -->
  <path d="M142 215 L128 225 L130 248 L142 255 L142 215Z" fill="#1a1050" stroke="#5a40cc" stroke-width="1"/>
  <path d="M136 230 L136 245 L141 248 L141 230Z" fill="#7b5fff" opacity="0.3"/>

  <!-- Hero glow aura -->
  <ellipse cx="160" cy="230" rx="35" ry="40" fill="#7b5fff" opacity="0.12" filter="url(#blur8)"/>

  <!-- Neon stage edge lines -->
  <line x1="60" y1="267" x2="260" y2="267" stroke="#7b5fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="60" y1="267" x2="260" y2="267" stroke="#b89fff" stroke-width="0.5" opacity="0.9"/>

  <!-- Spotlights from top corners -->
  <line x1="30" y1="30" x2="130" y2="260" stroke="#ff4fc8" stroke-width="0.5" opacity="0.15"/>
  <line x1="290" y1="30" x2="190" y2="260" stroke="#4fc8ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Top decorative bar -->
  <rect x="0" y="0" width="320" height="30" fill="#0a071e" opacity="0.8"/>
  <line x1="0" y1="30" x2="320" y2="30" stroke="#5a35ff" stroke-width="1"/>

  <!-- VEQZAI TOURNAMENT text -->
  <text x="160" y="20" text-anchor="middle" fill="#c4aaff" font-size="11" font-family="monospace" font-weight="bold" letter-spacing="3">VEQZAI TOURNAMENT</text>

  <!-- Particle dots -->
  <g fill="#b89fff">
    <circle cx="45" cy="70" r="1.5" opacity="0.6"/>
    <circle cx="90" cy="45" r="1" opacity="0.4"/>
    <circle cx="200" cy="55" r="1.5" opacity="0.5"/>
    <circle cx="265" cy="75" r="1" opacity="0.4"/>
    <circle cx="30" cy="300" r="1" opacity="0.3"/>
    <circle cx="295" cy="310" r="1.5" opacity="0.4"/>
    <circle cx="130" cy="40" r="1" opacity="0.5"/>
    <circle cx="250" cy="38" r="1" opacity="0.4"/>
  </g>

  <!-- Bottom glow -->
  <rect x="0" y="350" width="320" height="50" fill="url(#glow1)" opacity="0.3"/>
</svg>
