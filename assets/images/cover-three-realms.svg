<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0520"/>
      <stop offset="60%" stop-color="#1a0a35"/>
      <stop offset="100%" stop-color="#2a1050"/>
    </linearGradient>
    <radialGradient id="moon" cx="75%" cy="20%" r="15%">
      <stop offset="0%" stop-color="#e8d4ff"/>
      <stop offset="60%" stop-color="#b880ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b880ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="gf2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="400" height="220" fill="url(#sky)"/>

  <!-- Moon glow -->
  <circle cx="300" cy="40" r="35" fill="url(#moon)"/>
  <circle cx="300" cy="40" r="18" fill="#f0e0ff" opacity="0.9"/>
  <circle cx="300" cy="40" r="22" fill="#c890ff" opacity="0.2" filter="url(#gf2)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="30" cy="15" r="1"/>
    <circle cx="80" cy="8" r="1.5"/>
    <circle cx="130" cy="20" r="1"/>
    <circle cx="180" cy="10" r="1"/>
    <circle cx="220" cy="25" r="1.5"/>
    <circle cx="250" cy="12" r="1"/>
    <circle cx="340" cy="18" r="1"/>
    <circle cx="370" cy="30" r="1"/>
    <circle cx="50" cy="35" r="1"/>
    <circle cx="160" cy="38" r="1"/>
    <circle cx="380" cy="8" r="1.5"/>
  </g>

  <!-- Back mountains -->
  <path d="M0 160 L60 90 L120 140 L180 70 L240 120 L300 80 L360 110 L400 85 L400 220 L0 220Z" fill="#12082a" opacity="0.8"/>
  <!-- Mid mountains -->
  <path d="M0 180 L50 130 L110 165 L170 115 L230 150 L290 120 L350 145 L400 125 L400 220 L0 220Z" fill="#1a0d3a" opacity="0.9"/>

  <!-- Castle left -->
  <g fill="#0d0620">
    <rect x="30" y="135" width="60" height="65"/>
    <rect x="25" y="120" width="15" height="20"/>
    <rect x="75" y="118" width="15" height="22"/>
    <!-- Battlements -->
    <rect x="25" y="115" width="6" height="8"/>
    <rect x="34" y="115" width="6" height="8"/>
    <rect x="43" y="115" width="6" height="8"/>
    <rect x="75" y="113" width="6" height="8"/>
    <rect x="84" y="113" width="6" height="8"/>
    <!-- Gate -->
    <rect x="52" y="165" width="16" height="35" rx="2"/>
    <!-- Window lights -->
    <rect x="38" y="142" width="8" height="8" rx="1" fill="#c080ff" opacity="0.7"/>
    <rect x="74" y="140" width="8" height="8" rx="1" fill="#c080ff" opacity="0.5"/>
  </g>

  <!-- Castle right -->
  <g fill="#0a0520">
    <rect x="310" y="130" width="70" height="70"/>
    <rect x="305" y="115" width="16" height="20"/>
    <rect x="359" y="118" width="16" height="17"/>
    <!-- Tower -->
    <rect x="338" y="100" width="24" height="30"/>
    <rect x="334" y="96" width="6" height="8"/>
    <rect x="343" y="96" width="6" height="8"/>
    <rect x="352" y="96" width="6" height="8"/>
    <rect x="334" y="92" width="6" height="6"/>
    <rect x="343" y="92" width="6" height="6"/>
    <rect x="352" y="92" width="6" height="6"/>
    <!-- Gate -->
    <rect x="334" y="162" width="18" height="38" rx="2"/>
    <!-- Window lights -->
    <rect x="318" y="140" width="8" height="8" rx="1" fill="#80c0ff" opacity="0.7"/>
    <rect x="362" y="137" width="8" height="8" rx="1" fill="#80c0ff" opacity="0.5"/>
  </g>

  <!-- Center hero figure (warrior silhouette) -->
  <!-- Cape -->
  <path d="M185 220 Q185 175 180 155 L200 148 L220 155 Q215 175 215 220Z" fill="#1a0535" opacity="0.9"/>
  <!-- Body -->
  <rect x="186" y="152" width="28" height="50" rx="4" fill="#120828"/>
  <!-- Armor chest -->
  <path d="M188 155 Q200 150 212 155 L213 175 Q200 172 187 175Z" fill="#1e0e3a"/>
  <!-- Sword up -->
  <line x1="220" y1="90" x2="215" y2="160" stroke="#c0a0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="208" y1="145" x2="226" y2="140" stroke="#8060aa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sword glow -->
  <line x1="220" y1="90" x2="215" y2="145" stroke="#e0c0ff" stroke-width="1" opacity="0.6" filter="url(#gf2)"/>
  <!-- Shield -->
  <path d="M183 158 L170 165 L170 185 L183 192 L183 158Z" fill="#120828" stroke="#8060aa" stroke-width="1.5"/>
  <!-- Head/helm -->
  <ellipse cx="200" cy="142" rx="12" ry="13" fill="#0d0620"/>
  <!-- Visor glow -->
  <path d="M191 142 Q200 139 209 142 L208 148 Q200 150 192 148Z" fill="#c080ff" opacity="0.4"/>

  <!-- Hero glow -->
  <ellipse cx="200" cy="175" rx="40" ry="50" fill="#8040ff" opacity="0.07" filter="url(#gf)"/>

  <!-- Ground fog -->
  <rect x="0" y="195" width="400" height="25" fill="#150835" opacity="0.7"/>
  <ellipse cx="200" cy="210" rx="200" ry="15" fill="#200a40" opacity="0.5" filter="url(#gf)"/>

  <!-- Title overlay -->
  <rect x="0" y="0" width="400" height="35" fill="#0a0520" opacity="0.6"/>
  <text x="200" y="23" text-anchor="middle" fill="#c090ff" font-size="14" font-family="Georgia, serif" font-weight="bold" letter-spacing="4">THREE REALMS</text>
  <line x1="60" y1="30" x2="340" y2="30" stroke="#8040cc" stroke-width="0.5" opacity="0.5"/>
</svg>
