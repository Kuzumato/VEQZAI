<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="osky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a08"/>
      <stop offset="50%" stop-color="#101e0a"/>
      <stop offset="100%" stop-color="#182808"/>
    </linearGradient>
    <radialGradient id="sunset" cx="80%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#f0a030" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#e06020" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e06020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc040" stop-opacity="0"/>
    </radialGradient>
    <filter id="of"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="of2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="of6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="400" height="220" fill="url(#osky)"/>
  <!-- Sunset glow -->
  <rect width="400" height="220" fill="url(#sunset)"/>

  <!-- Distant forest treeline -->
  <g fill="#0a1806" opacity="0.9">
    <ellipse cx="10" cy="145" rx="22" ry="40"/>
    <ellipse cx="35" cy="135" rx="20" ry="45"/>
    <ellipse cx="58" cy="148" rx="18" ry="38"/>
    <ellipse cx="78" cy="140" rx="20" ry="42"/>
    <ellipse cx="98" cy="150" rx="16" ry="35"/>
    <ellipse cx="300" cy="148" rx="18" ry="38"/>
    <ellipse cx="323" cy="138" rx="20" ry="44"/>
    <ellipse cx="346" cy="145" rx="22" ry="40"/>
    <ellipse cx="368" cy="136" rx="18" ry="46"/>
    <ellipse cx="390" cy="148" rx="20" ry="38"/>
  </g>

  <!-- Village wall -->
  <rect x="100" y="130" width="200" height="90" fill="#1a1208" stroke="#3a2a10" stroke-width="1.5"/>
  <!-- Wall battlements -->
  <g fill="#1a1208" stroke="#3a2a10" stroke-width="1">
    <rect x="100" y="120" width="12" height="12"/>
    <rect x="116" y="118" width="12" height="14"/>
    <rect x="132" y="120" width="12" height="12"/>
    <rect x="148" y="118" width="12" height="14"/>
    <rect x="176" y="118" width="12" height="14"/>
    <rect x="212" y="118" width="12" height="14"/>
    <rect x="228" y="118" width="12" height="14"/>
    <rect x="244" y="120" width="12" height="12"/>
    <rect x="260" y="118" width="12" height="14"/>
    <rect x="276" y="120" width="12" height="12"/>
  </g>

  <!-- Gate tower left -->
  <rect x="100" y="88" width="35" height="135" fill="#141008" stroke="#3a2a10" stroke-width="1"/>
  <!-- Tower battlements -->
  <g fill="#141008" stroke="#3a2a10" stroke-width="1">
    <rect x="100" y="80" width="8" height="10"/>
    <rect x="112" y="78" width="8" height="12"/>
    <rect x="124" y="80" width="8" height="10"/>
  </g>

  <!-- Gate tower right -->
  <rect x="265" y="88" width="35" height="135" fill="#141008" stroke="#3a2a10" stroke-width="1"/>
  <g fill="#141008" stroke="#3a2a10" stroke-width="1">
    <rect x="265" y="80" width="8" height="10"/>
    <rect x="277" y="78" width="8" height="12"/>
    <rect x="289" y="80" width="8" height="10"/>
  </g>

  <!-- Gate opening -->
  <rect x="175" y="148" width="50" height="72" rx="4" fill="#0a0806"/>
  <!-- Gate portcullis -->
  <g stroke="#2a1a08" stroke-width="1.5" opacity="0.8">
    <line x1="180" y1="148" x2="180" y2="220"/>
    <line x1="188" y1="148" x2="188" y2="220"/>
    <line x1="196" y1="148" x2="196" y2="220"/>
    <line x1="204" y1="148" x2="204" y2="220"/>
    <line x1="212" y1="148" x2="212" y2="220"/>
    <line x1="220" y1="148" x2="220" y2="220"/>
    <line x1="175" y1="162" x2="225" y2="162"/>
    <line x1="175" y1="176" x2="225" y2="176"/>
    <line x1="175" y1="190" x2="225" y2="190"/>
  </g>

  <!-- Buildings inside village -->
  <g fill="#12100a">
    <rect x="120" y="148" width="30" height="50"/>
    <polygon points="105,148 135,125 165,148" fill="#0e0d08"/>
    <rect x="250" y="148" width="30" height="50"/>
    <polygon points="235,148 265,125 295,148" fill="#0e0d08"/>
  </g>

  <!-- Windows in buildings -->
  <rect x="128" y="160" width="8" height="8" rx="1" fill="#ffc040" opacity="0.7"/>
  <rect x="142" y="158" width="8" height="8" rx="1" fill="#ffa030" opacity="0.5"/>
  <rect x="258" y="160" width="8" height="8" rx="1" fill="#ffc040" opacity="0.7"/>
  <rect x="272" y="158" width="8" height="8" rx="1" fill="#ffa030" opacity="0.5"/>

  <!-- Lanterns on gate towers -->
  <circle cx="117" cy="112" r="8" fill="url(#lantern)"/>
  <circle cx="117" cy="112" r="3" fill="#ffe080" opacity="0.9"/>
  <circle cx="283" cy="112" r="8" fill="url(#lantern)"/>
  <circle cx="283" cy="112" r="3" fill="#ffe080" opacity="0.9"/>

  <!-- Road to gate -->
  <path d="M160 220 Q175 200 185 162 L215 162 Q225 200 240 220Z" fill="#201808" opacity="0.8"/>

  <!-- Hero silhouette walking toward gate -->
  <g transform="translate(200,210)">
    <!-- Legs (walking pose) -->
    <rect x="-8" y="-38" width="7" height="38" rx="3" fill="#101808" transform="rotate(-5)"/>
    <rect x="1" y="-38" width="7" height="38" rx="3" fill="#0c1408" transform="rotate(8)"/>
    <!-- Body -->
    <rect x="-10" y="-68" width="20" height="32" rx="3" fill="#141a08"/>
    <!-- Cloak -->
    <path d="M-10 -65 Q-18 -40 -16 0 L0 -5 L16 0 Q18 -40 10 -65Z" fill="#0c1208" opacity="0.7"/>
    <!-- Bow on back -->
    <path d="M10 -68 Q16 -58 10 -40" fill="none" stroke="#2a3010" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-68" x2="10" y2="-40" stroke="#181e08" stroke-width="1"/>
    <!-- Arms -->
    <line x1="-10" y1="-58" x2="-20" y2="-48" stroke="#141a08" stroke-width="7" stroke-linecap="round"/>
    <line x1="10" y1="-58" x2="18" y2="-50" stroke="#141a08" stroke-width="7" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="0" cy="-77" rx="10" ry="11" fill="#141a08"/>
    <!-- Hood -->
    <path d="M-10 -72 Q0 -88 10 -72 Q5 -68 0 -68 Q-5 -68 -10 -72Z" fill="#0c1208"/>
  </g>

  <!-- Ground glow from lanterns -->
  <ellipse cx="117" cy="135" rx="20" ry="8" fill="#ffa030" opacity="0.1" filter="url(#of2)"/>
  <ellipse cx="283" cy="135" rx="20" ry="8" fill="#ffa030" opacity="0.1" filter="url(#of2)"/>

  <!-- Ground / path -->
  <rect x="0" y="200" width="400" height="20" fill="#141008" opacity="0.7"/>

  <!-- Title -->
  <rect x="0" y="0" width="400" height="35" fill="#080e04" opacity="0.75"/>
  <text x="200" y="23" text-anchor="middle" fill="#80c060" font-size="14" font-family="Georgia, serif" font-weight="bold" letter-spacing="5">3D ORIGIN</text>
  <line x1="90" y1="30" x2="310" y2="30" stroke="#304820" stroke-width="0.5" opacity="0.5"/>
</svg>
