<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a2a3a"/>
      <stop offset="100%" stop-color="#06101a"/>
    </radialGradient>
    <filter id="tg"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="tg2"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg4)"/>

  <!-- Shield shape -->
  <path d="M50 15 L72 25 L72 52 Q72 68 50 80 Q28 68 28 52 L28 25 Z" fill="#061828" stroke="#00c8ff" stroke-width="2"/>
  <!-- Shield inner -->
  <path d="M50 20 L68 29 L68 51 Q68 65 50 75 Q32 65 32 51 L32 29 Z" fill="#081e30" stroke="#00c8ff" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Shield glow -->
  <path d="M50 15 L72 25 L72 52 Q72 68 50 80 Q28 68 28 52 L28 25 Z" fill="#00c8ff" opacity="0.05" filter="url(#tg)"/>

  <!-- V letter on shield -->
  <text x="50" y="58" text-anchor="middle" fill="#00c8ff" font-size="28" font-family="Arial Black, sans-serif" font-weight="900" opacity="0.9">V</text>
  <text x="50" y="58" text-anchor="middle" fill="#80e4ff" font-size="28" font-family="Arial Black, sans-serif" font-weight="900" opacity="0.3" filter="url(#tg2)">V</text>

  <!-- Shield top highlight -->
  <path d="M50 20 L68 29 L50 32 L32 29 Z" fill="#00c8ff" opacity="0.12"/>

  <!-- Crossed swords behind shield -->
  <!-- Sword 1 -->
  <line x1="20" y1="20" x2="80" y2="80" stroke="#1a4a6a" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="80" y2="80" stroke="#00c8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Guard 1 -->
  <line x1="34" y1="30" x2="26" y2="38" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Sword 2 -->
  <line x1="80" y1="20" x2="20" y2="80" stroke="#1a4a6a" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="20" y2="80" stroke="#00c8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Guard 2 -->
  <line x1="66" y1="30" x2="74" y2="38" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Stars top corners -->
  <circle cx="18" cy="18" r="3" fill="#ffd060" opacity="0.8"/>
  <circle cx="82" cy="18" r="3" fill="#ffd060" opacity="0.8"/>
  <circle cx="18" cy="18" r="6" fill="#ffd060" opacity="0.1" filter="url(#tg2)"/>
  <circle cx="82" cy="18" r="6" fill="#ffd060" opacity="0.1" filter="url(#tg2)"/>

  <!-- Border ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#00c8ff" stroke-width="1" opacity="0.4"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#00c8ff" stroke-width="3" opacity="0.08" filter="url(#tg)"/>
</svg>
