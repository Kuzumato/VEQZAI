<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Three Realms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered game cabinet. Title bar on top, 16:9 screen in the middle, touch pad or key chips underneath. */
  :root {
    --bg: #15121c;
    --panel: #211b2e;
    --line: #3b3252;
    --fg: #efe6d2;
    --muted: #a99dbf;
    --gold: #f0b83a;
    --ember: #d8493f;
    --font-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    --font-body: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; }
  .cab { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .bar h1 { margin: 0; font: 400 13px/1.2 var(--font-display); color: var(--gold); letter-spacing: .04em; text-wrap: balance; }
  .bar button, .tb { font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--fg); background: var(--panel); border: 2px solid var(--line); padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 #0c0a12; }
  .bar button:hover { border-color: var(--gold); }
  button:focus-visible, canvas:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .screen { width: min(100%, calc(74vh * 480 / 272)); margin: 0 auto; border: 4px solid var(--line); background: #000; box-shadow: 0 6px 0 #0c0a12; }
  canvas { display: block; width: 100%; aspect-ratio: 480 / 272; image-rendering: pixelated; touch-action: none; }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; }
  .keys li { display: flex; align-items: center; gap: 6px; }
  kbd { font: 400 10px/1 var(--font-display); color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-bottom-width: 4px; padding: 5px 6px; }
  .touch { display: flex; align-items: center; justify-content: space-between; gap: 14px; user-select: none; -webkit-user-select: none; }
  .stick { position: relative; width: 124px; height: 124px; flex: none; border-radius: 50%; background: var(--panel); border: 3px solid var(--line); touch-action: none; }
  .nub { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: var(--gold); border: 3px solid #8a6417; pointer-events: none; }
  .btns { display: grid; grid-template-columns: repeat(4, auto); gap: 8px; justify-content: end; align-items: center; min-width: 0; }
  .tb { touch-action: none; user-select: none; -webkit-user-select: none; font-size: 12px; padding: 0; width: 52px; height: 40px; border-radius: 8px; }
  .tb.rnd { width: 58px; height: 58px; border-radius: 50%; }
  .tb.big { width: 76px; height: 76px; border-radius: 50%; background: var(--ember); border-color: #7d211c; color: #fff; grid-row: span 1; }
  .tb:active, .tb.down { transform: translateY(2px); box-shadow: 0 1px 0 #0c0a12; }
  .note { margin: 0; text-align: center; color: var(--muted); font-size: 13px; text-wrap: balance; }
</style>

<main class="cab">
  <header class="bar">
    <h1>THREE REALMS</h1>
    <button id="mute" type="button" aria-pressed="false">Sound: on</button>
  </header>

  <div class="screen"><canvas id="game" width="480" height="272" tabindex="0" aria-label="Three Realms game screen"></canvas></div>

  <div class="touch" id="touch" hidden>
    <div class="stick" id="stick" aria-label="Move"><div class="nub" id="nub"></div></div>
    <div class="btns">
      <button class="tb" type="button" data-k="i">BAG</button>
      <button class="tb" type="button" data-k="q">QUEST</button>
      <button class="tb" type="button" data-k="escape">MENU</button>
      <button class="tb" type="button" data-k="r">POTION</button>
      <button class="tb rnd" type="button" data-k="k">DASH</button>
      <button class="tb rnd" type="button" data-k="l">SKILL</button>
      <button class="tb rnd" type="button" data-k="e">TALK</button>
      <button class="tb big" type="button" data-k="j">ATTACK</button>
    </div>
  </div>

  <ul class="keys" id="keys">
    <li><kbd>WASD</kbd> move</li>
    <li><kbd>J</kbd> attack</li>
    <li><kbd>L</kbd> skill</li>
    <li><kbd>K</kbd> dash</li>
    <li><kbd>E</kbd> talk / open</li>
    <li><kbd>R</kbd> potion</li>
    <li><kbd>I</kbd> bag</li>
    <li><kbd>Q</kbd> quests</li>
    <li><kbd>ESC</kbd> menu</li>
  </ul>
  <p class="note">Prototype build, Chapter 1. Mage and Ranger aim with the mouse. Progress saves automatically. Names and art are placeholders.</p>
</main>

<script>
(() => {
'use strict';
/* ======================================================================
   THREE REALMS: core helpers, input, audio
   ====================================================================== */
const W = 480, H = 272, T = 16, COLS = 30, ROWS = 17;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Press Start 2P", ui-monospace, "Courier New", monospace';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function px(g, c, x, y, w, h) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function text(s, x, y, o = {}) {
  const size = o.size || 8;
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'top';
  if (o.shadow !== false) { ctx.fillStyle = o.shadowCol || 'rgba(10,6,18,.9)'; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = o.col || '#efe6d2';
  ctx.fillText(s, x, y);
}
function wrap(str, maxW, size = 8) {
  ctx.font = size + 'px ' + FONT;
  const words = String(str).split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function pixelLine(g, x0, y0, x1, y1, col, s = 1, dash = 0) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, i = 0;
  g.fillStyle = col;
  for (;;) {
    if (!dash || (i % (dash * 2)) < dash) g.fillRect(x0, y0, s, s);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }

}
function makeNoise(seed) {
  const R = rng(seed), perm = new Float32Array(65536);
  for (let i = 0; i < perm.length; i++) perm[i] = R();
  const s = t => t * t * (3 - 2 * t);
  const n = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const g = (a, b) => perm[((a & 255) * 256) + (b & 255)];
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * s(xf) + (c - a) * s(yf) + (a - b - c + d) * s(xf) * s(yf);
  };
  return (x, y) => n(x, y) * .55 + n(x * 2, y * 2) * .3 + n(x * 4, y * 4) * .15;
}

/* ---------- sprites ---------- */
function makeSprite(rows, pal, name) {
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const f = document.createElement('canvas'); f.width = w; f.height = h;
  const a = c.getContext('2d'), b = f.getContext('2d');
  rows.forEach((r, y) => {
    if (r.length !== w) console.warn('sprite row width mismatch', name, y, r.length, w);
    for (let x = 0; x < w; x++) {
      const ch = r[x]; if (ch === '.' || !pal[ch]) continue;

    }
  });

}
function drawSpr(s, x, y, o = {}) {
  const sc = o.scale || 1, flip = o.flip ? -1 : 1;
  ctx.save();

  ctx.scale(flip * sc, sc);
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  ctx.drawImage(o.flash ? s.f : s.c, -s.w / 2, -s.h / 2);
  ctx.restore();
}

/* ---------- input ---------- */
const keys = {}, pressed = {}, touch = { x: 0, y: 0 };
const mouse = { x: 240, y: 136, t: -99999, type: 'mouse' };
const taps = [];
const kn = e => { const k = e.key.toLowerCase(); return k === 'spacebar' ? ' ' : k; };
addEventListener('keydown', e => {
  const k = kn(e);
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === 'tab' && document.activeElement === cv) e.preventDefault();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true; ensureAudio();
});
addEventListener('keyup', e => { keys[kn(e)] = false; });
const held = (...n) => n.some(k => keys[k]);
const tapped = (...n) => n.some(k => pressed[k]);
function canvasPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }

cv.addEventListener('pointerdown', e => {
  cv.focus({ preventScroll: true }); ensureAudio();
  const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; mouse.type = e.pointerType;
  taps.push(p);
});
function axis() {
  let x = (held('d', 'arrowright') ? 1 : 0) - (held('a', 'arrowleft') ? 1 : 0) + touch.x;
  let y = (held('s', 'arrowdown') ? 1 : 0) - (held('w', 'arrowup') ? 1 : 0) + touch.y;
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  return { x, y, m: Math.min(1, m) };
}
const navState = { sig: '0,0', hold: 0, rep: 0 };
function menuNav(dt) {
  const hd = (...n) => held(...n) || tapped(...n);
  let dx = (hd('d', 'arrowright') ? 1 : 0) - (hd('a', 'arrowleft') ? 1 : 0) + (touch.x > .5 ? 1 : 0) - (touch.x < -.5 ? 1 : 0);
  let dy = (hd('s', 'arrowdown') ? 1 : 0) - (hd('w', 'arrowup') ? 1 : 0) + (touch.y > .5 ? 1 : 0) - (touch.y < -.5 ? 1 : 0);
  dx = clamp(dx, -1, 1); dy = clamp(dy, -1, 1);
  const sig = dx + ',' + dy;
  if (sig !== navState.sig) { navState.sig = sig; navState.hold = 0; navState.rep = 0; return [dx, dy]; }
  if (dx || dy) { navState.hold += dt; if (navState.hold > .35) { navState.rep += dt; if (navState.rep > .11) { navState.rep = 0; return [dx, dy]; } } }

}

// touch controls
(function setupTouch() {
  const box = document.getElementById('touch');
  const coarse = window.matchMedia && (matchMedia('(pointer: coarse)').matches || matchMedia('(max-width: 640px)').matches);

    const r = stick.getBoundingClientRect();
    let dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);

    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); ensureAudio(); keys[k] = true; pressed[k] = true; b.classList.add('down'); });
    const up = () => { keys[k] = false; b.classList.remove('down'); };

/* ---------- audio ---------- */
let ac = null, muted = false;

  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }

  swing: () => tone(320, .09, 'sawtooth', .035, -180),
  cast: () => tone(700, .12, 'triangle', .05, -300),
  shoot: () => tone(520, .07, 'square', .03, -260),
  hit: () => tone(170, .1, 'square', .06, -90),
  kill: () => { tone(240, .16, 'square', .06, -170); tone(120, .2, 'triangle', .07, -60, .04); },
  hurt: () => tone(130, .28, 'sawtooth', .07, -80),
  pick: () => { tone(660, .08, 'square', .045); tone(880, .12, 'square', .045, 0, .07); },
  coin: () => tone(990, .07, 'square', .035),
  chest: () => [523, 659, 880].forEach((f, i) => tone(f, .12, 'triangle', .05, 0, i * .07)),
  dash: () => tone(500, .12, 'triangle', .05, -300),
  spin: () => tone(260, .25, 'sawtooth', .04, 360),
  nova: () => { tone(180, .4, 'sawtooth', .06, 500); tone(90, .4, 'triangle', .08, -30); },
  level: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'square', .05, 0, i * .09)),
  thud: () => tone(80, .3, 'triangle', .12, -40),
  open: () => [392, 523, 659].forEach((f, i) => tone(f, .14, 'triangle', .06, 0, i * .08)),
  talk: () => tone(420 + Math.random() * 60, .035, 'square', .02),
  menu: () => tone(600, .04, 'square', .03),
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .2, 'square', .05, 0, i * .12))
};

/* ======================================================================
   DATA: sprites, classes, items, enemies, bosses, quests, locations

   ====================================================================== */
const STORY = {

/* ---------- sprite art (12x12 pixel grids, placeholder art) ---------- */

let state = 'title';
let hero = null, P = null, zone = null;
const SAVE_KEY = 'veqzai.threerealms.v2';
const fade = { a: 0, dir: 0, cb: null };
const toasts = [];
let hitstop = 0, shake = 0, hurtFlash = 0, levelFx = 0, tick = 0;
const BAG_MAX = 30;

function newHero(cls, difficulty = 'average') {
  return {
    cls, lvl: 1, xp: 0, gold: 50, difficulty,
    inv: ['potion_s', 'potion_s', 'potion_s'],
    equip: { weapon: `w_${cls}_1`, armor: 'a_1', charm: null },
    quests: {}, cleared: {}, kingdom: 'df', node: 'df_capital', kills: {}, playTime: 0, totalKills: 0,
    achievements: {}, vcoins: 0, bossKills: 0, chestsOpened: 0, potionsUsed: 0, itemsBought: 0, bossNoDmg: false, endingReached: false
  };
}
const diffOf = () => DIFFICULTIES[hero.difficulty] || DIFFICULTIES.average;
const CL = () => CLASSES[hero.cls];
const gearOf = slot => hero.equip[slot] ? ITEMS[hero.equip[slot]] : null;
function stats() {
  const c = CL(), w = gearOf('weapon'), a = gearOf('armor'), ch = gearOf('charm');
  let maxHp = c.hp + c.hpG * (hero.lvl - 1), ap = c.atk + c.atkG * (hero.lvl - 1), def = c.def, spd = c.spd;
  if (w) ap += w.atk;
  if (a) def += a.def;
  if (ch) { if (ch.hp) maxHp += ch.hp; if (ch.atk) ap += ch.atk; if (ch.spd) spd *= 1 + ch.spd / 100; }
  return { maxHp: Math.round(maxHp), ap, def, spd };
}
const xpNeed = l => Math.round(30 * l + 8 * l * l);
const MAX_LVL = 20;
const relicCount = () => RELIC_IDS.filter(id => hero.inv.includes(id)).length;
const potionCount = () => hero.inv.filter(i => ITEMS[i].type === 'potion').length;

function notify(s, col = '#efe6d2') { toasts.push({ s, col, t: 2.4 }); if (toasts.length > 4) toasts.shift(); }

/* ---------- inventory ---------- */
function addItem(id, quiet) {
  const it = ITEMS[id];
  if (it.type !== 'relic' && hero.inv.length >= BAG_MAX) { notify('BAG FULL', '#ff8a7a'); return false; }
  hero.inv.push(id);
  if (!quiet) notify('+ ' + it.name, RAR_COL[it.rar]);
  return true;
}
function removeItem(id) { const i = hero.inv.indexOf(id); if (i >= 0) hero.inv.splice(i, 1); }
function resolveToken(tok) {
  if (ITEMS[tok]) return tok;
  const t = parseInt(tok.slice(1), 10);
  if (tok[0] === 'W') return `w_${hero.cls}_${t}`;
  if (tok[0] === 'A') return `a_${t}`;
  if (tok[0] === 'C') return `c_${pick(['hp', 'spd', 'atk'])}_${t}`;
  return 'potion_s';
}
function rollGear(lv, bonus = 0) {
  const t = clamp(Math.floor((lv + bonus) / 2.3 + Math.random()), 0, 5);
  const r = Math.random();
  if (r < .4) return `w_${hero.cls}_${t + 1}`;
  if (r < .75) return `a_${t + 1}`;
  return `c_${pick(['hp', 'spd', 'atk'])}_${t + 1}`;
}
function equipItem(id) {
  const it = ITEMS[id];
  if (it.type === 'weapon' && it.cls !== hero.cls) { notify('CLASS ONLY: ' + CLASSES[it.cls].name, '#ff8a7a'); return false; }
  const slot = it.type;
  if (!['weapon', 'armor', 'charm'].includes(slot)) return false;
  removeItem(id);
  const old = hero.equip[slot];
  hero.equip[slot] = id;
  if (old) hero.inv.push(old);
  syncPlayerStats();
  sfx.pick();
  return true;
}
function unequip(slot) {
  const id = hero.equip[slot];
  if (!id) return;
  if (hero.inv.length >= BAG_MAX) { notify('BAG FULL', '#ff8a7a'); return; }
  hero.equip[slot] = null; hero.inv.push(id); syncPlayerStats(); sfx.menu();
}
function syncPlayerStats() {
  if (!P) return;
  const s = stats(); const was = P.maxHp;
  P.maxHp = s.maxHp; P.hp = Math.min(P.maxHp, P.hp + Math.max(0, P.maxHp - was));
}
function usePotion() {
  if (!P || P.hp >= P.maxHp) return false;
  const pots = hero.inv.filter(i => ITEMS[i].type === 'potion').sort((a, b) => ITEMS[a].heal - ITEMS[b].heal);
  if (!pots.length) { notify('NO POTIONS', '#ff8a7a'); return false; }
  const it = ITEMS[pots[0]]; removeItem(it.id);
  hero.potionsUsed = (hero.potionsUsed||0) + 1; checkAchievements();
  P.hp = Math.min(P.maxHp, P.hp + it.heal); sfx.pick();
  if (state === 'zone') { burst(P.x, P.y, '#ff8a7a', 8, 50); addText(P.x, P.y - 12, '+' + it.heal, '#7fdc6a'); }
  return true;
}
function useBagItem(id) { // from bag screen
  const it = ITEMS[id];
  if (it.type === 'potion') {
    const mx = stats().maxHp, cur = P ? P.hp : mx;
    if (cur >= mx) { notify('HP IS FULL'); return; }
    removeItem(id);
    if (P) P.hp = Math.min(P.maxHp, P.hp + it.heal);
    sfx.pick();
  } else if (['weapon', 'armor', 'charm'].includes(it.type)) equipItem(id);
}

/* ---------- xp ---------- */
function gainXp(n) {
  if (hero.lvl >= MAX_LVL) return;
  hero.xp += n;
  while (hero.lvl < MAX_LVL && hero.xp >= xpNeed(hero.lvl)) {
    hero.xp -= xpNeed(hero.lvl); hero.lvl++;

/* ---------- main zone update ---------- */
function updZone(dt) {
  hero.playTime += dt; tick += dt;
  const s = stats();
  for (const k of ['inv', 'atkT', 'atkCd', 'castT', 'spinT', 'skillCd', 'dashT', 'dashCd', 'dashInv']) P[k] = Math.max(0, P[k] - dt);
  const a = axis();

  if (tapped('escape')) { pauseFrom = 'zone'; state = 'pause'; pauseSel = 0; return; }
  if (tapped('i', 'tab')) { openBag(); return; }
  if (tapped('q')) { openQuests(); return; }
  if (tapped('r', 'h')) usePotion();

  if (tapped('k', 'shift') && P.dashCd <= 0 && P.dashT <= 0) {

  if ((P.atkT > .09 && P.atkT <= .22) || P.spinT > .08) attackHits(s);

  if (P.dashT > 0) {
    mv(P, P.dash.x * 230 * dt, P.dash.y * 230 * dt);

  } else {
    const sp = s.spd * (P.spinT > 0 ? .55 : P.atkT > 0 ? .5 : P.castT > 0 ? .7 : 1);

    text('ATTACK', x + 10, y + 120, { col: '#a99dbf', shadow: false }); text(c.range, x + 10, y + 130, { col: '#efe6d2' });
    text('SKILL', x + 10, y + 144, { col: '#a99dbf', shadow: false }); text(c.skill, x + 10, y + 154, { col: '#7fdc6a' });
    wrap(c.blurb, w - 16, 8).slice(0, 3).forEach((ln, k) => text(ln, x + 10, y + 168 + k * 8 - 4, { col: '#a99dbf', shadow: false, size: 8 }));
  });
  text('LEFT/RIGHT  ENTER TO CHOOSE', W / 2, 248, { align: 'center', col: '#fff' });
}
function drawDiffSelect() {
  nightSky(11);
  px(ctx, 'rgba(10,6,18,.7)', 0, 0, W, H);
  text('SELECT DIFFICULTY', W / 2, 12, { align: 'center', size: 12, col: '#f0b83a' });
  DIFF_ORDER.forEach((id, i) => {
    const d = DIFFICULTIES[id], x = 8 + i * 116, y = 44, w = 108, h = 160, sel = i === selDiff;
    px(ctx, sel ? d.col : '#3b3252', x - 2, y - 2, w + 4, h + 4); px(ctx, sel ? '#1c1530' : '#15101f', x, y, w, h);
    text(d.name, x + w / 2, y + 10, { align: 'center', col: sel ? d.col : '#efe6d2', size: 8 });
    const stars = DIFF_ORDER.indexOf(id);
    for (let s = 0; s < 4; s++) px(ctx, s <= stars ? d.col : '#2a2238', x + 12 + s * 22, y + 26, 18, 6);
    const lines = [
      ['HP', Math.round(d.hpMul * 100) + '%'],
      ['DMG', Math.round(d.dmgMul * 100) + '%'],
      ['XP', Math.round(d.xpMul * 100) + '%'],
      ['GOLD', Math.round(d.goldMul * 100) + '%'],
    ];
    lines.forEach(([k, v], j) => {
      text(k, x + 12, y + 44 + j * 14, { col: '#a99dbf', shadow: false });
      text(v, x + w - 10, y + 44 + j * 14, { align: 'right', col: sel ? d.col : '#efe6d2' });
    });
    const descLines = d.desc.split('. ');
    descLines.forEach((ln, j) => text(ln, x + 10, y + 108 + j * 10, { col: '#a99dbf', shadow: false, size: 8 }));
    if (sel) { px(ctx, d.col, x, y + h - 18, w, 18); text('SELECTED', x + w / 2, y + h - 14, { align: 'center', col: '#000', shadow: false }); }
  });
  text('LEFT/RIGHT  ENTER TO START', W / 2, 240, { align: 'center', col: '#fff' });
  text('ESC TO GO BACK', W / 2, 252, { align: 'center', col: '#a99dbf', shadow: false });
}

function drawAchievements() {
  drawBackdrop(achFrom);
  panel(8, 8, 464, 256);
  text('ACHIEVEMENTS', 20, 14, { col: '#f0b83a' });
  const earned = ACHIEVEMENTS.filter(a => hero.achievements[a.id]).length;
  text(earned + '/' + ACHIEVEMENTS.length, 464, 14, { align: 'right', col: '#a99dbf' });
  text('V-COINS: ' + (hero.vcoins||0), 320, 14, { col: '#c58bff' });
  const vis = 14, top = clamp(achSel - 6, 0, Math.max(0, ACHIEVEMENTS.length - vis));
  for (let i = 0; i < vis; i++) {
    const a = ACHIEVEMENTS[top + i]; if (!a) break;
    const done = !!hero.achievements[a.id];
    const t = ACH_TIER[a.tier], y = 32 + i * 16, sel = top + i === achSel;
    if (sel) px(ctx, '#2a2040', 12, y - 2, 456, 15);
    const col = done ? t.col : '#5a4f70';
    text((done ? '★ ' : '  ') + a.name, 22, y, { col });
    text('[' + t.label + ']', 300, y, { col: t.col, shadow: false });
    text('+' + t.reward + ' VC', 440, y, { align: 'right', col: done ? '#c58bff' : '#3a3252' });
    if (sel) { text('>', 14, y, { col: '#f0b83a' }); text(a.desc, 22, y + 8, { col: '#a99dbf', shadow: false, size: 8 }); }
  }
  text('ESC/Q CLOSE', 20, 248, { col: '#a99dbf', shadow: false });
}

function startNewGame(cls) {
  const diff = DIFF_ORDER[selDiff] || 'average';
  hero = newHero(cls, diff); P = null; zone = null; mapSel = 'df_capital';
  state = 'dialog';
  startDialog([
    { who: '', text: 'The world is split into three kingdoms: Deepforest, Ruin and the Demon Base.' },
    { who: '', text: STORY.princess + ' has been stolen away to the ' + STORY.demonKingdom + '. Its gate is sealed by six relics.' },
    { who: CLASSES[cls].name, text: 'Then I will find the relics, break the seal, and bring her home.', face: cls }
  ], () => { enterLocation('df_capital'); });
}
function drawEnding() {
  nightSky(13);
  px(ctx, '#1d1230', 0, 215, W, 57);
  ctx.fillStyle = '#7a1d2b'; ctx.beginPath(); ctx.moveTo(150, 215); ctx.lineTo(150, 130); ctx.lineTo(160, 120); ctx.lineTo(170, 130); ctx.lineTo(170, 215); ctx.fill();
  px(ctx, '#ff5a4a', 380, 150, 3, 3); px(ctx, '#2a0c10', 340, 130, 80, 85); px(ctx, '#ff5a4a', 352, 120, 8, 14); px(ctx, '#ff5a4a', 400, 120, 8, 14);
  px(ctx, '#0b0810', 365, 160, 30, 55);
  drawSpr(SPR[hero.cls], 240, 200, { scale: 4 });
  text('THE DEMON GATE OPENS', W / 2, 24, { align: 'center', size: 12, col: '#ff8a7a' });
  text(STORY.chapter + ' COMPLETE', W / 2, 48, { align: 'center', col: '#f0b83a' });
  const m = Math.floor(hero.playTime / 60), s = Math.floor(hero.playTime % 60);
  text('LEVEL ' + hero.lvl + '   KILLS ' + hero.totalKills + '   TIME ' + m + ':' + String(s).padStart(2, '0'), W / 2, 66, { align: 'center' });
  text('TO BE CONTINUED IN THE ' + STORY.demonKingdom, W / 2, 88, { align: 'center', col: '#e8d9ff' });
  if (endT > .8 && Math.floor(performance.now() / 500) % 2 === 0) text('PRESS ENTER TO RETURN TO THE MAP', W / 2, 244, { align: 'center', col: '#fff' });
}

/* ---------- state updates ---------- */
function update(dt) {
  tick += dt;
  for (const t of toasts) t.t -= dt;
  while (toasts.length && toasts[0].t <= 0) toasts.shift();
  if (fade.dir) {
    fade.a += fade.dir * dt * 3;
    if (fade.dir > 0 && fade.a >= 1) { fade.a = 1; const cb = fade.cb; fade.cb = null; fade.dir = -1; if (cb) cb(); }
    else if (fade.dir < 0 && fade.a <= 0) { fade.a = 0; fade.dir = 0; }
    return;
  }
  if (hitstop > 0 && state === 'zone') { hitstop -= dt; return; }
  const menuStates = ['title', 'select', 'map', 'bag', 'quests', 'shop', 'pause'];
  const nav = menuStates.includes(state) ? menuNav(dt) : [0, 0];
  switch (state) {
    case 'title': {
      const items = titleItems();
      if (nav[1]) { titleSel = clamp(titleSel + nav[1], 0, items.length - 1); sfx.menu(); }
      for (const t of taps) { const i = Math.floor((t.y - 98) / 16); if (i >= 0 && i < items.length && t.y > 96) { titleSel = i; startTitleChoice(items[i]); break; } }
      if (tapped('enter', ' ', 'j')) startTitleChoice(items[titleSel]);
      break;
    }
    case 'select':
      if (nav[0]) { selCls = clamp(selCls + nav[0], 0, 2); sfx.menu(); }
      for (const t of taps) { if (t.y > 34 && t.y < 234) { const i = Math.floor((t.x - 10) / 152); if (i >= 0 && i < 3) { if (i === selCls) { state = 'diffselect'; } else { selCls = i; sfx.menu(); } } } }
      if (tapped('enter', ' ', 'j')) { state = 'diffselect'; sfx.menu(); }
      if (tapped('escape')) state = 'title';
      break;
    case 'diffselect':
      if (nav[0]) { selDiff = clamp(selDiff + nav[0], 0, DIFF_ORDER.length - 1); sfx.menu(); }
      for (const t of taps) { const i = Math.floor((t.x - 8) / 116); if (i >= 0 && i < 4 && t.y > 44 && t.y < 204) { if (i === selDiff) { startNewGame(CLASS_ORDER[selCls]); } else { selDiff = i; sfx.menu(); } } }
      if (tapped('enter', ' ', 'j')) startNewGame(CLASS_ORDER[selCls]);
      if (tapped('escape')) { state = 'select'; }
      break;
    case 'achievements':
      if (nav[1]) { achSel = clamp(achSel + nav[1], 0, ACHIEVEMENTS.length - 1); sfx.menu(); }
      if (tapped('escape', 'i', 'tab')) { state = achFrom; }
      break;
    case 'map':
      if (tapped('i', 'tab')) { openBag(); break; }
      if (tapped('q')) { openQuests(); break; }
      if (tapped('escape')) { pauseFrom = 'map'; state = 'pause'; pauseSel = 0; break; }
      updMap(dt, nav); break;
    case 'zone': updZone(dt); break;
    case 'dialog': updDialog(dt); break;
    case 'bag': updBag(dt, nav); break;
    case 'quests': updQuests(dt, nav); if (state !== 'quests' && questFrom === 'pause') state = 'pause'; break;
    case 'shop': updShop(dt, nav); break;
    case 'pause': updPause(dt, nav); break;
    case 'over':
      overT += dt; updFx(dt);
      if (overT > .8 && (tapped('enter', ' ', 'j') || taps.length)) {
        hero.gold = Math.floor(hero.gold * .9);
        fadeTo(() => { state = 'map'; mapSel = hero.node; P = null; save(); notify('YOU WERE DEFEATED. LOST 10% GOLD.', '#ff8a7a'); });
      }
      break;
    case 'ending':
      endT += dt;
      if (endT > .8 && (tapped('enter', ' ', 'j') || taps.length)) { state = 'map'; mapSel = 'rk_demon'; save(); }
      break;
  }
}

/* ---------- render ---------- */
function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  switch (state) {
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'diffselect': drawDiffSelect(); break;
    case 'achievements': drawAchievements(); break;
    case 'map': drawMapScreen(); break;
    case 'ending': drawEnding(); break;
    case 'zone': drawZone(); drawHUD(); break;
    case 'dialog':
      if (dlg && dlg.bg === 'zone') { drawZone(); drawHUD(); } else if (dlg && dlg.bg === 'map') drawMapScreen(); else { nightSky(21); px(ctx, 'rgba(10,6,18,.6)', 0, 0, W, H); }
      drawDialog(); break;
    case 'bag': drawBag(); break;
    case 'quests': drawQuests(); break;
    case 'shop': drawShop(); break;
    case 'pause': drawPause(); break;
    case 'over':
      drawZone(); drawHUD();
      ctx.fillStyle = 'rgba(40,6,12,' + Math.min(.75, overT) + ')'; ctx.fillRect(0, 0, W, H);
      if (overT > .4) { text('YOU WERE DEFEATED', W / 2, 108, { align: 'center', size: 12, col: '#ff8a7a' }); text('Level and items are kept. You lose 10% gold.', W / 2, 132, { align: 'center' }); }
      if (overT > .8 && Math.floor(performance.now() / 500) % 2 === 0) text('PRESS ENTER TO RETURN TO THE MAP', W / 2, 160, { align: 'center', col: '#fff' });
      break;
  }
  if (state !== 'title' && state !== 'select') drawToasts();
  if (fade.a > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fade.a + ')'; ctx.fillRect(0, 0, W, H); }
}

/* ---------- boot ---------- */
const muteBtn = document.getElementById('mute');
function toggleMute() { muted = !muted; muteBtn.textContent = 'Sound: ' + (muted ? 'off' : 'on'); muteBtn.setAttribute('aria-pressed', String(muted)); }
muteBtn.addEventListener('click', () => { ensureAudio(); toggleMute(); });
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'm' && !e.repeat) toggleMute(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'zone') { pauseFrom = 'zone'; state = 'pause'; pauseSel = 0; } });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'zone') { pauseFrom = 'zone'; state = 'pause'; pauseSel = 0; } });

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  try { update(dt); render(); } catch (err) { console.error(err); }
  for (const k in pressed) delete pressed[k];
  taps.length = 0;
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
requestAnimationFrame(frame);


})();
</script>
