<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VEQZAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/auth-login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <a href="../../../index.html" class="back-link">← Back to Home</a>

  <div class="login-wrapper">
    <div class="login-header">
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle"><i class="fa-solid fa-gem" aria-hidden="true"></i> Login to VEQZAI <i class="fa-solid fa-gem" aria-hidden="true"></i></p>
    </div>

    <div class="login-container">
      <h2>Login</h2>
      <div class="error-message" id="error-msg"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input 
            id="username" 
            type="text" 
            placeholder="Enter your username or email" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            id="password" 
            type="password" 
            placeholder="Enter your password" 
            required 
          />
        </div>

        <div class="form-options">
          <div class="remember-me">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="mailto:support@veqzai.com?subject=VEQZAI%20password%20reset" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit">Login Now</button>

        <div class="signup-link">
          Don't have an account? <a href="../../../signup.html">Sign up here</a>
        </div>
      </form>
    </div>
  </div>
  <script src="../../../assets/js/auth-login.js"></script>
</body>
</html>
